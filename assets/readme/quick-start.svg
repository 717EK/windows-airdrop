<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="292" viewBox="0 0 1200 292" role="img" aria-labelledby="title desc">
<title id="title">Three steps to receive a file</title><desc id="desc">Plug in the supported TP-Link USB adapter. Open the configured PulseIt app and start receiving. Share using AirDrop on iPhone, then approve on Windows.</desc>
