<g fill="#1768e8"><circle cx="59" cy="59" r="19"/><circle cx="455" cy="59" r="19"/><circle cx="851" cy="59" r="19"/></g>
<g fill="white" font-size="20" font-weight="700" text-anchor="middle"><text x="59" y="66">1</text><text x="455" y="66">2</text><text x="851" y="66">3</text></g>
<g fill="#10243f" font-size="23" font-weight="700"><text x="90" y="67">Plug in the adapter</text><text x="486" y="67">Start receiving</text><text x="882" y="67">Share from iPhone</text></g>
<g fill="none" stroke="#1768e8" stroke-width="4" stroke-linejoin="round"><rect x="58" y="101" width="47" height="56" rx="7"/><path d="M70 101V86h22v15m-10 56v13m-24 0h47"/><rect x="454" y="102" width="98" height="61" rx="7"/><path d="M503 163v12m-24 0h48"/><rect x="850" y="93" width="39" height="78" rx="7"/><path d="M906 130h43m-11-11 11 11-11 11"/></g>
<g fill="#455b76" font-size="18"><text x="42" y="208">TP-Link Archer T3U</text><text x="42" y="237">USB ID: 2357:012d</text><text x="438" y="208">Open your configured PulseIt</text><text x="438" y="237">Turn receiving on</text><text x="834" y="208">Share → AirDrop → Windows PC</text><text x="834" y="237">Approve the file on Windows</text></g>
</g></svg>
