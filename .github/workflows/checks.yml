name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r installer/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: dotnet build desktop/PulseDrop.csproj -c Release
      - run: dotnet build tools/bleprobe/bleprobe.csproj -c Release
      # Native MinGW/hardware qualification: docs/build.md.
